# CS2 LAN lobby stack. Run on a Linux host. Add a server by copying a cs2-N block
# (new name, volume, port) and adding a matching entry to servers.json.
x-cs2: &cs2
  image: joedwards32/cs2:latest
  restart: unless-stopped
  environment: &cs2env
    CS2_LAN: "1"
    CS2_MAXPLAYERS: "12"
    CS2_GAMETYPE: "0"
    CS2_GAMEMODE: "1"
    CS2_STARTMAP: de_dust2
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
  volumes:
    - ./cs2/pre.sh:/etc/pre.sh:ro

services:
  cs2-1:
    <<: *cs2
    container_name: cs2-1
    environment:
      <<: *cs2env
      CS2_SERVERNAME: "LAN Server 1"
      CS2_PORT: "27015"
      CS2_RCONPW: ${RCON_PASSWORD_1:?set RCON_PASSWORD_1 in .env}
      MATCHZY_LOG_URL: "http://lobby:8080/internal/events/cs2-1"
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    volumes:
      - ./cs2/pre.sh:/etc/pre.sh:ro
      - cs2-1-data:/home/steam/cs2-dedicated

  cs2-2:
    <<: *cs2
    container_name: cs2-2
    environment:
      <<: *cs2env
      CS2_SERVERNAME: "LAN Server 2"
      CS2_PORT: "27016"
      CS2_RCONPW: ${RCON_PASSWORD_2:?set RCON_PASSWORD_2 in .env}
      MATCHZY_LOG_URL: "http://lobby:8080/internal/events/cs2-2"
    ports:
      - "27016:27016/udp"
      - "27016:27016/tcp"
    volumes:
      - ./cs2/pre.sh:/etc/pre.sh:ro
      - cs2-2-data:/home/steam/cs2-dedicated

  lobby:
    image: fragnight:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    environment:
      # The address players type to reach the lobby, e.g. http://192.168.1.10:8080
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
      ADMIN_STEAMIDS: ${ADMIN_STEAMIDS:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      DEV_LOGIN: ${DEV_LOGIN:-0}
      MATCH_MAX_MINUTES: ${MATCH_MAX_MINUTES:-180}
      DB_PATH: /data/lobby.db
      SERVERS_FILE: /config/servers.json
    volumes:
      - lobby-data:/data
      - ./servers.json:/config/servers.json:ro
    ports:
      - "${LOBBY_PORT:-8080}:8080"

volumes:
  lobby-data:
  cs2-1-data:
  cs2-2-data:
